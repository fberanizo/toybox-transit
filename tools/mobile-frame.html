<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phone frame</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; display: grid; place-items: center; background: #2b2f3a; font-family: system-ui, sans-serif; color: #cfd3dd; }
  /* Scale the whole phone to fit any window height; the game inside still lays out at 390×816 CSS px. */
  .phone { width: 390px; height: 844px; border-radius: 44px; padding: 14px; background: #111; box-shadow: 0 20px 60px rgba(0,0,0,.5);
           transform-origin: center; }
  iframe { width: 390px; height: 816px; border: 0; border-radius: 32px; background: #fff; display: block; }
  p { position: fixed; top: 8px; left: 12px; margin: 0; font-size: 12px; }
</style>
</head>
<body>
  <!-- Dev tool: renders the built game at phone size (390×816 CSS px) inside desktop Chrome so layout and
       animations can be reviewed live. Input is mouse, not touch. Usage: /tools/mobile-frame.html?src=../dist/latest.html -->
  <p>Phone layout preview · 390×816 · mouse input</p>
  <div class="phone"><iframe id="f" title="Game at phone size"></iframe></div>
  <script>
    const src = new URLSearchParams(location.search).get('src') || '../dist/latest.html';
    document.getElementById('f').src = src;
    const fit = () => {
      const s = Math.min(1, (innerHeight - 40) / 872, (innerWidth - 20) / 418);
      document.querySelector('.phone').style.transform = `scale(${s})`;
    };
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
